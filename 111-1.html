<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>字音字形大挑戰 Part 1</title>
<style>
body{
  font-family:"Microsoft JhengHei",sans-serif;
  background:#f3f4f6;
  text-align:center;
  padding:20px;
}
#game{
  max-width:720px;
  margin:auto;
  background:#fff;
  padding:25px;
  border-radius:16px;
  box-shadow:0 4px 12px rgba(0,0,0,.1);
}
h1{margin-bottom:10px;}
#info{font-size:18px;margin-bottom:15px;}
.question{font-size:30px;margin:20px 0;}
.options button{
  width:100%;
  font-size:22px;
  padding:16px;
  margin:10px 0;
  border:none;
  border-radius:12px;
  background:#e0e7ff;
  cursor:pointer;
  text-align:left;
}
.options button:disabled{
  background:#e5e7eb;
  cursor:not-allowed;
}
.correct{background:#bbf7d0 !important;}
.wrong{background:#fecaca !important;}
#nextBtn{
  display:none;
  font-size:22px;
  padding:12px 36px;
  border:none;
  border-radius:12px;
  background:#4f46e5;
  color:#fff;
  margin-top:20px;
}
</style>
</head>

<body>

<h1>✏️ 字音字形大挑戰 Part 1</h1>

<div id="game">
  <div id="info"></div>
  <div class="question" id="question"></div>
  <div class="options" id="options"></div>
  <button id="nextBtn" onclick="nextQuestion()">下一題</button>
</div>

<script>
const idioms = [
"手舞足蹈","力爭上游","口是心非","人山人海","大公無私","兩全其美",
"班門弄斧","大同小異","黑白分明","海闊天空","鳥語花香","名正言順",
"一元復始","爭先恐後","一見如故","不時之需","無話不談","按部就班",
"自作主張","安分守己","雨後春筍","除舊布新","窗明几淨","冰天雪地",
"度日如年","品學兼優","名列前茅","半途而廢","變化多端","滴水穿石",
"古色古香","多此一舉","眉開眼笑","溫故知新","歡天喜地","走馬看花"
];

// 洗牌
function shuffle(arr){ return arr.sort(()=>Math.random()-0.5); }

// 產生克漏字題目
function makeQuestion(idiom){
  const index = Math.floor(Math.random()*idiom.length);
  const answer = idiom[index];
  const blank = idiom.split("");
  blank[index] = "□";

  // 干擾選項
  const pool = "上下左右天地人物心手口日月山水大小多少".split("");
  let options = shuffle([answer,...shuffle(pool).filter(c=>c!==answer).slice(0,3)]);
  return { q: blank.join(""), a: answer, o: options };
}

let questions = shuffle(idioms).slice(0,20).map(makeQuestion);
let current = 0;
let score = 0;
let answered = false;

function loadQuestion(){
  answered=false;
  document.getElementById("nextBtn").style.display="none";
  document.getElementById("info").innerText =
    `第 ${current+1} 題 / 20 ｜ 得分：${score}`;
  document.getElementById("question").innerText =
    "請選出正確的字：" + questions[current].q;

  const optBox=document.getElementById("options");
  optBox.innerHTML="";
  shuffle([...questions[current].o]).forEach(opt=>{
    const btn=document.createElement("button");
    btn.innerText=opt;
    btn.onclick=()=>check(btn,opt);
    optBox.appendChild(btn);
  });
}

function check(btn,choice){
  if(answered) return;
  answered=true;
  document.querySelectorAll(".options button").forEach(b=>b.disabled=true);
  if(choice===questions[current].a){
    btn.classList.add("correct");
    score+=5;
  }else{
    btn.classList.add("wrong");
    document.querySelectorAll(".options button").forEach(b=>{
      if(b.innerText===questions[current].a) b.classList.add("correct");
    });
  }
  document.getElementById("nextBtn").style.display="inline-block";
}

function nextQuestion(){
  current++;
  if(current<20) loadQuestion();
  else{
    document.getElementById("game").innerHTML=
      `<h2>🎉 挑戰完成</h2>
       <p>總分：<strong>${score}</strong> 分（滿分 100）</p>
       <button onclick="location.reload()">再玩一次</button>`;
  }
}

loadQuestion();
</script>

</body>
</html>
